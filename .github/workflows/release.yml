name: release

# Push a tag v* (or run manually with a tag) to build the macOS and Windows installers
# and attach them to the GitHub release of that tag. Each installer bundles the local backend, built
# from the pen-editor-backend commit pinned in backend-ref.txt.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            files: app/release/*.exe
          - os: macos-latest
            dist: dist
            files: |
              app/release/*.dmg
              app/release/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build ui
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Read the pinned backend commit
        id: backend
        shell: bash
        run: |
          ref="$(tr -d '[:space:]' < backend-ref.txt)"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "backend-ref.txt must hold one 40-character commit SHA, got: $ref" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: dan-rozhkov/pen-editor-backend
          ref: ${{ steps.backend.outputs.ref }}
          path: backend-src
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
      - name: Build the local backend bundle
        working-directory: backend-src
        run: |
          npm ci
          npm run build:local
      - name: Build installer
        working-directory: app
        env:
          SIDEFORM_LIGHT_BACKEND_BUNDLE: ${{ github.workspace }}/backend-src/dist-local
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run ${{ matrix.dist }} -- --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Sideform Light ${{ env.TAG }}
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
