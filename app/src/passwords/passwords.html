<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="passwords.title">Passwords</title>
    <link rel="stylesheet" href="passwords.css" />
  </head>
  <body>
    <div class="app">
      <section class="list-pane" aria-label="Logins" data-i18n-aria-label="passwords.listAria">
        <h1 class="pane-title" data-i18n="passwords.title">Passwords</h1>
        <div class="list-head">
          <label class="search">
            <span class="icon" data-pen-slot="MagnifyingGlass"></span>
            <input id="search" type="search" placeholder="Search logins" aria-label="Search logins" data-i18n-placeholder="passwords.searchPlaceholder" data-i18n-aria-label="passwords.searchPlaceholder" autocomplete="off" spellcheck="false" />
          </label>
          <button id="add-btn" class="btn-accent icon-only" type="button" aria-label="Add login" title="Add login" data-i18n-aria-label="passwords.add" data-i18n-title="passwords.add">
            <span class="icon" data-pen-slot="Plus"></span>
          </button>
        </div>
        <div id="never-head" class="never-head" hidden>
          <button id="never-back" class="btn btn-ghost icon-only" type="button" aria-label="Back to logins" title="Back to logins" data-i18n-aria-label="passwords.backToLogins" data-i18n-title="passwords.backToLogins">
            <span class="icon" data-pen-slot="ArrowLeft"></span>
          </button>
          <h2 class="never-title" data-i18n="passwords.neverTitle">Never ask to save</h2>
        </div>
        <p id="unavailable" class="banner" role="alert" data-i18n="passwords.unavailable" hidden>
          Secure storage is not available on this system, so passwords cannot be saved.
        </p>
        <p id="status" class="banner" role="alert" hidden></p>
        <div id="list" class="list" role="listbox" aria-label="Saved logins" data-i18n-aria-label="passwords.savedAria"></div>
        <div id="list-empty" class="list-empty empty-state panel" hidden>
          <span id="list-empty-icon" class="empty-icon" aria-hidden="true"></span>
          <p id="list-empty-title" class="empty-title"></p>
          <p id="list-empty-text" class="empty-text"></p>
        </div>
        <div class="list-foot">
          <button id="never-link" class="link-btn" type="button" hidden></button>
          <p id="storage-note" class="storage-note">Encrypted on this device</p>
        </div>
      </section>

      <main id="detail" class="detail-pane" aria-live="polite"></main>
    </div>

    <script src="../tabbar/i18nClient.js"></script>
    <script src="../tabbar/glyphs.js"></script>
    <script src="helpers.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
